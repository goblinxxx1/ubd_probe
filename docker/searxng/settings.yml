# SearXNG — self-hosted metasearch for crawler discovery. JSON API on.
# google/bing ENABLED: verified live-working from our residential IP (27-40 / 10 real results,
# no CAPTCHA) — they carry the largest index. yandex DISABLED forever (project rule: no Russian
# service). SearXNG marks any engine that throttles as unresponsive and drops it gracefully.
use_default_settings: true
server:
  secret_key: "change-me-searxng-secret"   # override in prod via env SEARXNG_SECRET
  bind_address: "0.0.0.0"
  port: 8080
search:
  formats:
    - html
    - json
  autocomplete: ""
  default_lang: "uk"
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yandex
    disabled: true
