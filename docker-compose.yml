services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ubd
    volumes:
      - ubd-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # NOTE: 3306 intentionally NOT published (clashes with external mysql-container)
  db-backup:
    image: mysql:8.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-172800}
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups          # HOST dir on purpose: survives `down -v` / volume wipe
    restart: unless-stopped
  adminer:
    image: adminer
    ports:
      - "8888:8080"
    depends_on:
      - db
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/ubd
      JWT_SECRET: ${JWT_SECRET}
      CRAWLER_API_KEY: ${CRAWLER_API_KEY}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # App-readiness gate: migrations + seed + uvicorn must be serving before
      # dependents (crawler) start. python is already in the backend image — no
      # extra deps (curl/wget not guaranteed).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  public:
    build: ./public
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUBLIC_PORT:-8080}:80"

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-8082}:80"

  fixture:
    image: nginx:alpine
    profiles: ["crawler"]
    volumes:
      - ./docker/fixture:/usr/share/nginx/html:ro

  searxng:
    image: searxng/searxng:latest
    profiles: ["crawler"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  crawler:
    build: ./crawler
    profiles: ["crawler"]
    # unless-stopped so the loop-mode crawler (CRAWL_INTERVAL_SECONDS>0) survives a
    # Docker/host restart — the whole point of adding restart policies here. NOTE: in
    # one-shot mode (CRAWL_INTERVAL_SECONDS=0) the process exits 0 and this policy would
    # re-run it in a loop; run one-shot passes via `run --rm` (which ignores the policy),
    # not `up`.
    restart: unless-stopped
    # Load search config (SEARCH_KEYWORDS / SEARCH_PROVIDERS / limits, bot accounts,
    # EXTRACTOR, ACTIVE_DISCOVERY) from crawler/.env if present. Optional: absence
    # doesn't break the offline demo (falls back to image defaults). The environment
    # block below overrides the few Docker-network values. Per-run flags (-e) win over both.
    env_file:
      - path: crawler/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
      fixture:
        condition: service_started
      searxng:
        condition: service_started
    volumes:
      - ubd-crawler-state:/data
    environment:
      INTERNAL_API_URL: http://backend:8000
      CRAWLER_API_KEY: ${CRAWLER_API_KEY}
      EXTRACTOR: heuristic
      SEARCH_STATE_PATH: /data/search_state.json
      CRAWL_INTERVAL_SECONDS: ${CRAWL_INTERVAL_SECONDS:-0}
      SEARXNG_URL: http://searxng:8080
      SEARCH_PROVIDERS: ${SEARCH_PROVIDERS:-duckduckgo,searxng}

volumes:
  ubd-db-data:
  ubd-crawler-state:
